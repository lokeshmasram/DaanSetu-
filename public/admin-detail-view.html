<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Details - DaanSetu</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="dashboard-styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      .detail-view-container {
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 2rem;
      }

      .detail-view-content {
        max-width: 1400px;
        margin: 0 auto;
      }

      .detail-header {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 15px;
        padding: 2rem;
        margin-bottom: 2rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .detail-title {
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .detail-title h1 {
        margin: 0;
        color: #2d3748;
        font-size: 2rem;
      }

      .detail-title i {
        font-size: 2.5rem;
        color: #667eea;
      }

      .detail-actions {
        display: flex;
        gap: 1rem;
      }

      .back-button {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 25px;
        cursor: pointer;
        font-weight: 500;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .back-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      }

      .export-button {
        background: #00b894;
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 25px;
        cursor: pointer;
        font-weight: 500;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .export-button:hover {
        background: #00a085;
        transform: translateY(-2px);
      }

      .filters-section {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 15px;
        padding: 1.5rem;
        margin-bottom: 2rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      }

      .filters-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1rem;
      }

      .filter-item {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .filter-item label {
        font-weight: 600;
        color: #4a5568;
        font-size: 0.9rem;
      }

      .filter-item input,
      .filter-item select {
        padding: 0.5rem;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        font-size: 0.9rem;
      }

      .data-table-container {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 15px;
        padding: 2rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        overflow-x: auto;
      }

      .data-table {
        width: 100%;
        border-collapse: collapse;
        min-width: 800px;
      }

      .data-table thead {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
      }

      .data-table th {
        padding: 1rem;
        text-align: left;
        font-weight: 600;
        white-space: nowrap;
      }

      .data-table td {
        padding: 1rem;
        border-bottom: 1px solid #e2e8f0;
      }

      .data-table tbody tr {
        transition: background 0.2s ease;
      }

      .data-table tbody tr:hover {
        background: #f7fafc;
      }

      .status-badge {
        padding: 0.25rem 0.75rem;
        border-radius: 15px;
        font-size: 0.85rem;
        font-weight: 600;
        display: inline-block;
      }

      .status-available {
        background: #667eea;
        color: white;
      }

      .status-matched {
        background: #00b894;
        color: white;
      }

      .status-completed {
        background: #6c757d;
        color: white;
      }

      .status-cancelled {
        background: #ff6b6b;
        color: white;
      }

      .status-verified {
        background: #00b894;
        color: white;
      }

      .status-pending {
        background: #ffd93d;
        color: #856404;
      }

      .loading-spinner {
        text-align: center;
        padding: 3rem;
        color: #667eea;
      }

      .loading-spinner i {
        font-size: 3rem;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .empty-state {
        text-align: center;
        padding: 3rem;
        color: #a0aec0;
      }

      .empty-state i {
        font-size: 4rem;
        margin-bottom: 1rem;
        opacity: 0.5;
      }

      .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 0.5rem;
        margin-top: 2rem;
      }

      .pagination button {
        padding: 0.5rem 1rem;
        border: none;
        background: #667eea;
        color: white;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .pagination button:hover:not(:disabled) {
        background: #764ba2;
      }

      .pagination button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .pagination span {
        color: white;
        font-weight: 600;
      }

      .action-button {
        padding: 0.5rem 1rem;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.85rem;
        transition: all 0.3s ease;
      }

      .action-view {
        background: #667eea;
        color: white;
      }

      .action-view:hover {
        background: #764ba2;
      }

      @media (max-width: 768px) {
        .detail-header {
          flex-direction: column;
          gap: 1rem;
        }

        .detail-actions {
          width: 100%;
          flex-direction: column;
        }

        .back-button,
        .export-button {
          width: 100%;
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="detail-view-container">
      <div class="detail-view-content">
        <!-- Header -->
        <div class="detail-header">
          <div class="detail-title">
            <i class="fas fa-chart-bar" id="headerIcon"></i>
            <h1 id="pageTitle">Loading...</h1>
          </div>
          <div class="detail-actions">
            <button class="back-button" onclick="window.location.href='/admin-dashboard'">
              <i class="fas fa-arrow-left"></i> Back to Dashboard
            </button>
            <button class="export-button" onclick="exportData()">
              <i class="fas fa-download"></i> Export CSV
            </button>
          </div>
        </div>

        <!-- Filters -->
        <div class="filters-section">
          <div class="filters-grid" id="filtersGrid">
            <!-- Filters will be dynamically added -->
          </div>
        </div>

        <!-- Data Table -->
        <div class="data-table-container">
          <div id="loadingSpinner" class="loading-spinner">
            <i class="fas fa-spinner"></i>
            <p>Loading data...</p>
          </div>

          <div id="emptyState" class="empty-state" style="display: none;">
            <i class="fas fa-inbox"></i>
            <h3>No Data Found</h3>
            <p>There are no records to display.</p>
          </div>

          <div id="tableContainer" style="display: none;">
            <table class="data-table" id="dataTable">
              <thead id="tableHead">
                <!-- Table headers will be dynamically added -->
              </thead>
              <tbody id="tableBody">
                <!-- Table rows will be dynamically added -->
              </tbody>
            </table>

            <!-- Pagination -->
            <div class="pagination" id="pagination">
              <button id="prevPage" onclick="changePage(-1)">
                <i class="fas fa-chevron-left"></i> Previous
              </button>
              <span id="pageInfo">Page 1 of 1</span>
              <button id="nextPage" onclick="changePage(1)">
                Next <i class="fas fa-chevron-right"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/admin-detail-view.js"></script>
  </body>
</html>
