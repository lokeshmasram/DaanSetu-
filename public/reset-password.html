<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - DaanSetu</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="modal" id="resetPasswordModal" style="display: block;">
        <div class="modal-content">
            <span class="close-btn" id="closeResetModal">&times;</span>
            <h2>Reset Your Password</h2>
            <div id="tokenError" style="display: none; color: red; margin-bottom: 15px; text-align: center;"></div>
            <form id="resetPasswordForm">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="newPassword" name="newPassword" required minlength="6">
                        <button type="button" class="toggle-password" aria-label="Show password">
                            <i class="fas fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                    <small style="color: #666; font-size: 12px;">Password must be at least 6 characters long</small>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6">
                        <button type="button" class="toggle-password" aria-label="Show password">
                            <i class="fas fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" id="submitBtn">Reset Password</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                document.getElementById('tokenError').textContent = 'Invalid reset link. Please request a new password reset.';
                document.getElementById('tokenError').style.display = 'block';
                document.getElementById('resetPasswordForm').style.display = 'none';
                return;
            }

            document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                const submitBtn = document.getElementById('submitBtn');

                // Validate passwords match
                if (newPassword !== confirmPassword) {
                    alert('Passwords do not match. Please try again.');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Resetting...';

                try {
                    const response = await fetch('/api/auth/reset-password', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ token, newPassword })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        alert('Password reset successfully! You can now log in with your new password.');
                        window.location.href = '/index.html';
                    } else {
                        alert(data.message || 'Failed to reset password');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('An error occurred. Please try again.');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Reset Password';
                }
            });

            document.getElementById('closeResetModal').addEventListener('click', function() {
                window.location.href = '/index.html';
            });

            // Initialize password toggle on this page
            document.querySelectorAll('.toggle-password').forEach(btn => {
                btn.addEventListener('click', () => {
                    const wrapper = btn.closest('.password-wrapper');
                    if (!wrapper) return;
                    const input = wrapper.querySelector('input[type="password"], input[type="text"]');
                    if (!input) return;

                    if (input.type === 'password') {
                        input.type = 'text';
                        btn.setAttribute('aria-label', 'Hide password');
                        const icon = btn.querySelector('i');
                        if (icon) { icon.classList.remove('fa-eye'); icon.classList.add('fa-eye-slash'); }
                    } else {
                        input.type = 'password';
                        btn.setAttribute('aria-label', 'Show password');
                        const icon = btn.querySelector('i');
                        if (icon) { icon.classList.remove('fa-eye-slash'); icon.classList.add('fa-eye'); }
                    }
                });
            });
        });
    </script>
</body>
</html>
